<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" fill="none" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0.06"/>
    </linearGradient>
    <style>
      .p  { fill: #39FF14; }
      .c  { fill: #C9D1D9; }
      .m  { fill: #8B949E; }
      .k  { fill: #58A6FF; }
      text { font-size: 17px; }
      .line { opacity: 0; }
      .l1 { animation: show .01s linear .4s forwards; }
      .l2 { animation: show .01s linear 1.1s forwards; }
      .l3 { animation: show .01s linear 1.9s forwards; }
      .l4 { animation: show .01s linear 2.7s forwards; }
      .l5 { animation: show .01s linear 3.5s forwards; }
      .l6 { animation: show .01s linear 4.3s forwards; }
      .l7 { animation: show .01s linear 5.1s forwards; }
      .l8 { animation: show .01s linear 5.9s forwards; }
      .l9 { animation: show .01s linear 6.7s forwards; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="818" height="438" rx="12" fill="#0D1117" stroke="#39FF14" stroke-opacity="0.5"/>
  <rect x="1" y="1" width="818" height="438" rx="12" fill="url(#scan)"/>

  <!-- title bar -->
  <path d="M1 13 A12 12 0 0 1 13 1 H807 A12 12 0 0 1 819 13 V38 H1 Z" fill="#161B22"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="20" r="6" fill="#27C93F"/>
  <text x="410" y="25" text-anchor="middle" class="m" font-size="14">shamila@github: ~</text>

  <!-- body -->
  <g transform="translate(28, 74)">
    <text class="line l1"><tspan class="p">$</tspan><tspan class="c" dx="10">whoami</tspan></text>
    <text y="30"  class="line l2"><tspan class="m">&#8250;</tspan><tspan class="c" dx="10">Shamila Hasaranga — Full-Stack Developer</tspan></text>

    <text y="78"  class="line l3"><tspan class="p">$</tspan><tspan class="c" dx="10">cat profile.txt</tspan></text>
    <text y="108" class="line l4"><tspan class="m">&#8250;</tspan><tspan class="k" dx="10">stack </tspan><tspan class="c">TypeScript · React · Node.js · Python</tspan></text>
    <text y="132" class="line l5"><tspan class="m">&#8250;</tspan><tspan class="k" dx="10">focus </tspan><tspan class="c">LLM engineering · RAG · knowledge graphs</tspan></text>
    <text y="156" class="line l6"><tspan class="m">&#8250;</tspan><tspan class="k" dx="10">where </tspan><tspan class="c">Sri Lanka 🇱🇰</tspan></text>

    <text y="204" class="line l7"><tspan class="p">$</tspan><tspan class="c" dx="10">./say_hi.sh</tspan></text>
    <text y="234" class="line l8"><tspan class="m">&#8250;</tspan><tspan class="c" dx="10">building software that solves real-world problems</tspan></text>

    <text y="282" class="line l9"><tspan class="p">$</tspan><tspan class="c cursor" dx="10">&#9608;</tspan></text>
  </g>
</svg>
